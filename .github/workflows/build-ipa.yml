name: BootMaker - IPA sin firma (UIKit v0.2)
on:
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Instalar XcodeGen
        run: brew install xcodegen
      - name: Pruebas automáticas del lector de ISO
        run: bash Tests/test_reader.sh
      - name: Generar proyecto Xcode
        run: xcodegen generate --spec project.yml
      - name: Compilar para iPhone (sin firma)
        run: |
          set -euo pipefail
          xcodebuild -project BootMaker.xcodeproj \
            -scheme BootMaker \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/BootMakerBuild" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Empaquetar IPA
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -R "$RUNNER_TEMP/BootMakerBuild/Build/Products/Release-iphoneos/BootMaker.app" Payload/
          zip -q -r BootMaker-unsigned.ipa Payload
      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: BootMaker-unsigned-IPA
          path: BootMaker-unsigned.ipa
          if-no-files-found: error
